    <h1>Dog Age to Dog Years Calendar</h1>
    <form>
        <p>Enter your dog's age (in human years): </p>
        <input id="dogForm" type="text">
        <input id="calcBtn" type="button" value="Calculate" onclick="convertDogAgeToHuman()">
    </form>

    <script>
        document.getElementById("calcBtn").addEventListener("click", convertDogAgeToHuman)

        function convertDogAgeToHuman(d) {
                return d * 7;
            }

        let formInput = document.getElementById("dogForm").elements[0].value
        let dog_age = convertDogAgeToHuman(formInput)
    </script>
