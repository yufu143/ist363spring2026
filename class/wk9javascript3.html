    <h2>Working w/ APIs Activity</h2>
    <body onload="getData()">
    <script>
        // https://data.syr.gov/
        // Syracuse Pavement Ratings (2024)

        async function getData() {

            const requestOptions = {
                method: "GET",
                redirect: "follow"
            };
        
            try {

                const response = await fetch("https://services6.arcgis.com/bdPqSfflsdgFRVVM/arcgis/rest/services/Syracuse_Pavement_Ratings_(2024)/FeatureServer/0/query?where=1%3D1&outFields=Rating2024,StreetName,Block,Ward,RatingCate,Shape__Length,StreetWidt&outSR=4326&f=json", requestOptions);

                const result = await response.text();

                console.log(result)

            } catch (error) {
                console.error(error);
            };
            
            
        }

        getData()

    </script>
