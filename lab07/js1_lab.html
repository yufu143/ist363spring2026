<h1>LAB 07 JavaScript</h1>
<script>
        // QUESTION #1
        let favNumber = 20;
        
        console.log("My favorite number is " + favNumber + ".");


        // QUESTION #2
        let favoriteFoods = ["noodles", "strawberry cheesecake", "clams", "chicken soup", "rice"];
        console.log(favoriteFoods[1]);
        
        favoriteFoods.push("dumplings");
        
        console.log(favoriteFoods);


        // QUESTION #3
        for (let i = 0; i < favoriteFoods.length; i++) {
                console.log("Favorite Food " + (i + 1) + ": " + favoriteFoods[i]);
        }


        // QUESTION #4 
        for (let i = 0; i < favoriteFoods.length; i++) {
                if (i == 1) {
                        continue;
                }
                console.log("Favorite Food " + (i + 1) + ": " + favoriteFoods[i]);
        }


        // QUESTION #5 
        let book = {
                title: "Dungeon Meshi Vol. 8",
                author: "Ryoko Kui",
                yearPublished: 2019,
                isAvailable: true
        };

        console.log(book.title);
        console.log(book.author);

        if (book["isAvailable"] == true) {
                console.log("This book is available for checkout.");
        } else {
                console.log("Sorry, this book is currently checked out.");
        }


        // QUESTION #6
        let x = 1;
        while (x <= 20) {
                if (x % 2 == 0) {
                        console.log(x);
                };
                x++;
        }


        // QUESTION #7         
        let randomNumber = Math.floor(Math.random() * 6) + 1;
        console.log(randomNumber);


</script>
