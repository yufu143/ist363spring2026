<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 05 Corrections</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="#">
                    <img src="./images/logo_small.png" alt="Camera Logo">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNavAltMarkup">
                    <div class="navbar-nav">
                        <a class="nav-link" href="#">About</a>
                        <a class="nav-link" href="#">Portfolio</a>
                        <a class="nav-link" href="#">Shop</a>
                        <a class="nav-link" href="#">Contact</a>                        
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <main class="text-center container">
        <h1 class="mt-5 fw-light">Portfolio</h1>
        <section class="row g-3 g-lg-3">
            <div class="col-lg-6 g-3 g-lg-3">
                <div class="row g-3 g-lg-3">
                    <img class="col-12 col-lg-6" src="./images/blue-flower.jpg" alt="Blue-violet flower covered in dewdrops">
                    <img class="col-12 col-lg-6" src="./images/mountains.jpg" alt="Snowy mountain landscape">
                    <img class="col-12 col-lg-6" src="./images/architecture.jpg" alt="Brightly-lit night cityscape">
                    <img class="col-12 col-lg-6" src="./images/lake.jpg" alt="Boats on a lake surface">
                </div>
            </div>
            <img class="col-12 col-lg-6 mt-3" src="./images/clouds.jpg" alt="Stormy clouds">
            <img class="col-12 col-lg-3" src="./images/plum.jpg" alt="Plums">
            <img class="col-12 col-lg-3" src="./images/snow.jpg" alt="Mounds of snow">
            <img class="col-12 col-lg-3" src="./images/blue-eryngo.jpg" alt="Blue eryngo flower">
            <img class="col-12 col-lg-3" src="./images/art.jpg" alt="Blue-themed collection of art supplies">
        </section>
        <button type="button" class="btn btn-primary mt-4 mb-5" data-bs-toggle="button">See More</button>
    </main>
    <footer class="bg-secondary-subtle text-center p-4">
        <h1 class="fw-light">About the artist</h1>
        <p class="text-secondary">Capturing moments through the lens, my passion is bringing emotions to life in every frame.</p>
        <button type="button" class="btn btn-outline-dark" data-bs-toggle="button">Read More</button>
    </footer>
